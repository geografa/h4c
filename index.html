        map.addLayer({
          id: "point",
          source: "single-point",
          type: "circle",
          paint: {

            "circle-color": "#f30",

        // Create a popup, but don't add it to the map yet.
        var popup = new mapboxgl.Popup({

        map.on("mouseenter", "taxlots", function (e) {
          // Change the cursor style as a UI indicator.
          map.getCanvas().style.cursor = "pointer";

          // variables for description in popup
          var coordinates = e.features[0].geometry.coordinates.slice();
          var description =
            "<strong>Building SQFT:</strong> " +
            e.features[0].properties.BLDGSQFT +
            "<br><strong>Lot SQFT:</strong> " +
            e.features[0].properties.A_T_SQFT +
            "<br><strong>FAR:</strong> " +
            // round     e.features[0].properties.A_T_SQFT to 2 decimal places
            Math.round(
              (e.features[0].properties.BLDGSQFT /
                e.features[0].properties.A_T_SQFT) *
                100
            ) /
              100;

          // Ensure that if the map is zoomed out such that multiple
          // copies of the feature are visible, the popup appears
          // over the copy being pointed to.
          while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
            coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
          }

          // Populate the popup and set its coordinates
          // based on the feature found.
          popup.setLngLat(e.lngLat).setHTML(description).addTo(map);
        });

        map.on("mouseleave", "taxlots", function () {
          map.getCanvas().style.cursor = "";
          popup.remove();
        });

        // Listen for the `result` event from the MapboxGeocoder that is triggered when a user
        // makes a selection and add a symbol that matches the result and then
        // add the taxlots.
        geocoder.on("result", function (ev) {
          var coordinates = ev.result.geometry.coordinates;
          map.getSource("single-point").setData(ev.result.geometry);
          let coords = coordinates.toString();
          getTaxlot(coords);
          getZoning(coords);
        });
      });

      // taxlot query
      const getTaxlot = (loc) => {
        var url =
          "https://www.portlandmaps.com/arcgis/rest/services/Public/Taxlots/MapServer/0/query?where=1%3D1&text=&objectIds=&time=&geometry=" +
          loc +
          "&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&relationParam=&outFields=*&returnGeometry=true&returnTrueCurves=false&maxAllowableOffset=&geometryPrecision=&outSR=4326&returnIdsOnly=false&returnCountOnly=false&orderByFields=&groupByFieldsForStatistics=&outStatistics=&returnZ=false&returnM=false&gdbVersion=&returnDistinctValues=false&resultOffset=&resultRecordCount=&queryByDistance=&returnExtentsOnly=false&datumTransformation=&parameterValues=&rangeValues=&f=geojson";
        var req = new XMLHttpRequest();
        req.responseType = "json";
        req.open("GET", url, true);
        req.onload = function () {
          var jsonResponse = req.response;
          if (map.getLayer("taxlots")) {
            map.getSource("taxlots").setData(jsonResponse);
          } else {
            map.addLayer({
              id: "taxlots",
              type: "fill",
              slot: "middle",
              source: {
                type: "geojson",
                data: jsonResponse,
              },
              layout: {},
              paint: {
                "fill-color": "#088",
                "fill-opacity": 0.8,
              },
            });
          }
          if (map.getLayer("eraser")) {
            map.getSource("eraser").setData(jsonResponse);
          } else {
            map.addSource("eraser", {
              type: "geojson",
              data: turf.bboxPolygon(turf.bbox(jsonResponse)),
            });
            map.addLayer({
              id: "eraser",
              type: "clip",
              source: "eraser",
              layout: {
                "clip-layer-types": ["symbol", "model"],
              },
            });
          }
          // create a centroid from the taxlot geometry
          var centroid = turf.centroid(jsonResponse);

          // if there's already a model source, update it with the new data
          // otherwise, create a new model source with the new data
          if (map.getSource("model")) {
            map.getSource("model").setData({
              type: "Feature",
              properties: {
                "model-uri":
                  "https://geografa.github.io/h4c/model/little_house.glb",
              },
              geometry: {
                coordinates: centroid.geometry.coordinates,
                type: "Point",
              },
            });
          } else {
            map.addSource("model", {
              type: "geojson",
              data: {
                type: "Feature",
                properties: {
                  "model-uri":
                    "https://geografa.github.io/h4c/model/little_house.glb",
                },
                geometry: {
                  coordinates: centroid.geometry.coordinates,
                  type: "Point",
                },
              },
            });
            map.addLayer({
              id: "house",
              type: "model",
              source: "model",
              minzoom: 15,
              layout: {
                "model-id": ["get", "model-uri"],
              },
              paint: {
                //   "model-opacity": 1,
                "model-rotation": [0, 0, 90],
                "model-scale": [4, 4, 4],
                //   "model-color-mix-intensity": 0,
                //   "model-cast-shadows": true,
                //   "model-emissive-strength": 0.8,
              },
            });
          }
        };
        req.send();
      };

      // zoning query
      const getZoning = (loc) => {
        var url =
          "https://www.portlandmaps.com/arcgis/rest/services/Public/Zoning/MapServer/3/query?where=1%3D1&geometry=" +
          loc +
          "&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=*&outSR=4326&f=geojson";
        var req = new XMLHttpRequest();
        req.responseType = "json";
        req.open("GET", url, true);
        req.onload = function () {
          var jsonResponse = req.response;
          if (map.getLayer("zoning")) {
            map.getSource("zoning").setData(jsonResponse);
            map.getSource("zoning-label").setData(jsonResponse);
          } else {
            // add zoning layer
            map.addLayer({
              id: "zoning",
              type: "fill",
              slot: "middle",
              source: {
                type: "geojson",
                data: jsonResponse,
              },
              paint: {
                "fill-color": "#088",
                "fill-opacity": 0.25,
              },
            });

            // add zoning label
            map.addLayer({
              id: "zoning-label",
              type: "symbol",
              slot: "middle",
              source: {
                type: "geojson",
                data: jsonResponse,
              },
              layout: {
                "text-field": "{ZONE}",
                "text-size": 24,
              },
              paint: {
                "text-halo-color": "#fff",
                "text-halo-width": 2.75,
              },
            });
            // when the zoning layer loads, and is clicked, log the properties of the clicked feature
            map.on("click", "zoning", function (e) {
              // where the zoning CMP matches the baseZones CMP, log the baseZones properties
              baseZones.forEach((zone) => {
                if (zone.CMP === e.features[0].properties.ZONE) {
                  // add a popup with the baseZones properties
                  new mapboxgl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(
                      `<h2>${zone.zone}</h2>
                      <p><strong>Description:</strong> ${zone.description}</p>
                      <p><strong>Allowable Uses:</strong> ${zone.allowableUses.join(
                        ", "
                      )}</p>
                      <p><strong>Location:</strong> ${zone.location}</p>
                      <p><strong>Max Height:</strong> ${zone.maxHeight}</p>
                      ${
                        zone.FAR
                          ? `<p><strong>FAR:</strong> ${zone.FAR}</p>`
                          : `<p><strong>FAR:</strong> Not applicable</p>`
                      }
                      ${
                        zone.bonusProvisions
                          ? `<p><strong>Bonus Provisions:</strong> ${zone.bonusProvisions}</p>`
                          : `<p><strong>Bonus Provisions:</strong> Not eligible</p>`
                      }
                      <p><strong>Parking Restrictions:</strong> ${
                        zone.parkingRestrictions
                      }</p>`
                    )
                    .addTo(map);
                }
              });
              console.log(e.features[0].properties);
            });
          }
        };
        req.send();
      };
    </script>
  </body>
</html>
